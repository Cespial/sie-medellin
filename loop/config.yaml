# ============================================================
# SIE Medellín — Configuración del Data Loop
# ============================================================
loop:
  version: "1.0"
  nombre: "SIE Medellín Data Loop"

# Código DANE de Medellín
medellin:
  codigo_dane: "05001"
  nombre: "Medellín"
  departamento: "Antioquia"
  codigo_departamento: "05"

fuentes:
  medata:
    activa: true
    base_url: "https://medata.gov.co/api/3/action"
    frecuencia: "semanal"
    datasets: []  # Se llenan dinámicamente al descubrir datasets

  datos_gov:
    activa: true
    base_url: "https://www.datos.gov.co/resource"
    frecuencia: "mensual"
    datasets:
      # SIMAT matrícula: no Socrata ID — sourced from MEData CSV exports
      - id: "kgxf-xxbe"
        nombre: "Saber 11 Microdatos"
        tabla_destino: "fact_calidad"
      - id: "emd6-ef7x"
        nombre: "Directorio Establecimientos"
        tabla_destino: "dim_instituciones"
      - id: "sras-4t5p"
        nombre: "Estadísticas Educativas por ETC"
        tabla_destino: "fact_estadisticas_etc"
        filtro: "nombre_etc='Medellín'"

  icfes:
    activa: true
    frecuencia: "anual"

  dane:
    activa: true
    frecuencia: "anual"

directorios:
  raw: "loop/data/raw"
  processed: "loop/data/processed"
  geojson: "public/geojson"
